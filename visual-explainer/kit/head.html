<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITLE — your explainer</title>
<meta name="description" content="ONE SENTENCE: what this explains and who it is for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --canvas:#f6f3f1; --paper:#ffffff; --wash:#efebe7; --ink:#1d1c1a; --ink2:#4e4d4d; --ink3:#797776;
  --hair:#cecac8; --slab:#141312; --slab-ink:#f6f3f1; --rail:#141312; --rail-ink:#efeae4; --rail-dim:#8e8983; --rail-hair:#2c2a27;
  --learn:#2b59d1; --learn-soft:#cfdaf5; --frozen:#b9b5b1; --frozen-soft:#e6e2de;
  --good:#1f9d63; --good-soft:#d1ffca; --bad:#e0543a; --bad-soft:#ffd9cf; --move:#fff100; --move-ink:#1d1c1a;
  --gold:#ecda98; --sky:#a0b5eb; --mint:#a7fccd; --coral:#ff9473;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --cond:"Anton","Bebas Neue","Arial Narrow",Impact,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#12110f; --paper:#1c1b19; --wash:#23211e; --ink:#f1ece6; --ink2:#c4bfb8; --ink3:#8e8983;
  --hair:#393632; --slab:#262420; --slab-ink:#f1ece6; --rail:#0b0a09; --rail-hair:#23211e;
  --learn:#7d9cf0; --learn-soft:#24304f; --frozen:#5d5955; --frozen-soft:#2c2a27;
  --good:#4fd08f; --good-soft:#1b3a2a; --bad:#ff7a5e; --bad-soft:#44241d; --move:#fff100; --move-ink:#12110f;}}
:root[data-theme="dark"]{
  --canvas:#12110f; --paper:#1c1b19; --wash:#23211e; --ink:#f1ece6; --ink2:#c4bfb8; --ink3:#8e8983;
  --hair:#393632; --slab:#262420; --slab-ink:#f1ece6; --rail:#0b0a09; --rail-hair:#23211e;
  --learn:#7d9cf0; --learn-soft:#24304f; --frozen:#5d5955; --frozen-soft:#2c2a27;
  --good:#4fd08f; --good-soft:#1b3a2a; --bad:#ff7a5e; --bad-soft:#44241d; --move:#fff100; --move-ink:#12110f;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--learn);outline-offset:2px}
code{font-family:var(--mono);background:var(--wash);border-radius:6px;padding:1px 5px;font-size:.92em}

/* ================= app shell ================= */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);color:var(--rail-ink);padding:22px 14px 30px;scrollbar-width:thin;scrollbar-color:#3a3733 transparent}
.rail .brand{display:block;text-decoration:none;color:var(--rail-ink);padding:0 10px}
.rail .brand b{display:block;font-family:var(--cond);font-weight:400;font-size:40px;line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.rail .brand span{display:block;font-size:11px;color:var(--rail-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.rail .q{margin:18px 4px 6px;position:relative}
.rail .q input{width:100%;background:#1f1d1b;border:1px solid var(--rail-hair);border-radius:100px;padding:9px 14px 9px 34px;color:var(--rail-ink);font-size:12.5px}
.rail .q::before{content:"⌕";position:absolute;left:13px;top:6px;color:var(--rail-dim);font-size:16px}
.rail .part{margin:18px 0 4px;padding:0 10px;display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-dim)}
.rail .part i{font-style:normal;font-variant-numeric:tabular-nums}
.rail a.nav{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;text-decoration:none;color:#c9c4bd;font-size:12.5px;padding:7px 10px;border-radius:12px;line-height:1.25}
.rail a.nav em{font-style:normal;font-size:10.5px;color:var(--rail-dim);font-variant-numeric:tabular-nums}
.rail a.nav:hover{background:#1f1d1b;color:#fff}
.rail a.nav.on{background:var(--rail-ink);color:#141312}
.rail a.nav.on em{color:#141312}
.rail a.nav.seen:not(.on) em::after{content:" ✓";color:#6ff0a8}
.rail .foot{display:flex;gap:6px;margin:22px 4px 0;flex-wrap:wrap}
.rtog{border:1px solid var(--rail-hair);background:transparent;color:var(--rail-ink);border-radius:100px;padding:7px 12px;font-size:11px;text-transform:uppercase;cursor:pointer}
.rtog[aria-pressed="true"]{background:var(--move);color:#141312;border-color:var(--move)}
.rail .keys{margin:16px 10px 0;font-size:10.5px;color:var(--rail-dim);line-height:1.8}
.rail .keys kbd{font-family:var(--mono);border:1px solid var(--rail-hair);border-radius:5px;padding:0 5px;color:var(--rail-ink)}
.bar{height:3px;background:var(--rail-hair);border-radius:3px;margin:14px 10px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--move);width:0;transition:width .4s}

.main{min-width:0;position:relative}
.mobtop{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:90;transform:translateX(-102%);transition:transform .25s}
  body.drawer .rail{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .mobtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--hair)}
  .mobtop button{border:1px solid var(--hair);background:var(--paper);border-radius:100px;padding:7px 14px;font-size:12px;text-transform:uppercase;cursor:pointer}
  .mobtop span{font-family:var(--serif);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* ================= page ================= */
.page{display:none;padding:26px clamp(16px,2.6vw,40px) 110px;max-width:1640px;margin:0 auto}
.page.on{display:block;animation:pgin .38s cubic-bezier(.2,.7,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.crumb b{font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:100px;padding:4px 11px}
.page h2{font-family:var(--serif);font-weight:400;letter-spacing:-.022em;line-height:1.02;font-size:clamp(30px,3.4vw,54px);margin:4px 0 16px;max-width:26ch;text-wrap:balance}
.page h2 em{font-style:italic;color:var(--learn)} .page h2 em.bad{color:var(--bad)} .page h2 em.good{color:var(--good)} .page h2 em.amber{color:#c98a00}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.col{min-width:0}
@media (max-width:1180px){.stage{grid-template-columns:1fr}}
.figbox{background:var(--paper);border:1px solid var(--hair);border-radius:34px;padding:clamp(14px,2.4vw,30px);min-width:0}
.figbox + .figbox{margin-top:18px}
.figbox h3{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.4vw,30px);line-height:1.1;margin:0 0 10px;letter-spacing:-.015em}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:18px}
@media (max-width:1180px){.side{position:static}}
@media (max-width:760px){
  .page{padding-bottom:230px}
  .page.on .narr{position:fixed;left:10px;right:10px;bottom:10px;z-index:50;padding:12px 16px 12px;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .narr p{font-size:18px;min-height:0;margin:6px 0 10px}
  .narr .dots button{width:22px;height:22px}
  .narr .nav2{margin-top:8px}
  .scroll svg.dg{min-width:0!important}
  svg.dg{max-height:none!important}
}
.narr{background:var(--slab);color:var(--slab-ink);border-radius:30px;padding:22px 22px 18px}
.narr .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.6;display:flex;justify-content:space-between}
.narr p{font-family:var(--serif);font-size:24px;line-height:1.15;margin:10px 0 16px;min-height:3.4em;text-wrap:pretty}
.narr p b{font-weight:400;color:var(--move)}
.narr .dots{display:flex;gap:6px;flex-wrap:wrap}
.narr .dots button{width:26px;height:26px;border-radius:50%;border:1px solid color-mix(in srgb,var(--slab-ink) 30%,transparent);background:transparent;color:var(--slab-ink);font-size:10.5px;cursor:pointer;padding:0}
.narr .dots button.on{background:var(--move);color:#141312;border-color:var(--move)}
.narr .dots button.done{background:color-mix(in srgb,var(--slab-ink) 18%,transparent)}
.narr .nav2{display:flex;gap:8px;margin-top:14px}
.narr .nav2 button{flex:1;border:1px solid color-mix(in srgb,var(--slab-ink) 30%,transparent);background:transparent;color:var(--slab-ink);border-radius:100px;padding:9px 0;font-size:11.5px;text-transform:uppercase;cursor:pointer}
.narr .nav2 button.pri{background:var(--slab-ink);color:var(--slab)}
.stat{background:var(--paper);border:1px solid var(--hair);border-radius:24px;padding:16px 18px}
.stat b{display:block;font-family:var(--cond);font-weight:400;font-size:46px;line-height:.92;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);margin-top:6px}
.stat b.blue{color:var(--learn)} .stat b.grn{color:var(--good)} .stat b.red{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .stat b{font-size:34px}
.words{display:none;font-size:13.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--hair);border-radius:24px;padding:16px 18px}
body.words-on .words{display:block}
.src{font-size:11px;color:var(--ink3)}
.src code{font-size:10.5px}

/* step reveal */
[data-s]{transition:opacity .45s ease}
.fig-later{opacity:.07}
.fig-now{animation:nowpulse 1.2s ease 1}
@keyframes nowpulse{0%{opacity:.2}40%{opacity:1}100%{opacity:1}}

svg.dg{width:100%;height:auto;display:block;overflow:visible;max-height:calc(100vh - 190px)}
svg.dg text{font-family:var(--mono);fill:var(--ink)}
.scroll{overflow-x:auto}
.scroll svg.dg{min-width:620px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
figure{margin:0}
.cap{color:var(--ink3);font-size:12px;margin:10px 2px 0;max-width:80ch}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px;font-size:11.5px;text-transform:uppercase;color:var(--ink2)}
.ctl input[type=range]{accent-color:var(--learn);width:min(240px,60vw)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--canvas);border-radius:100px;padding:9px 18px;font-size:11.5px;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--hair);border-radius:100px;padding:3px;gap:2px;background:var(--canvas)}
.seg button{border:0;background:transparent;border-radius:100px;padding:7px 12px;font-size:11px;text-transform:uppercase;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.readout{font-variant-numeric:tabular-nums;color:var(--ink);text-transform:none}
.chip{display:inline-block;border-radius:100px;padding:3px 10px;font-size:11px;border:1px solid var(--hair);background:var(--canvas)}
.chip.learn{background:var(--learn-soft);border-color:transparent}.chip.frozen{background:var(--frozen-soft);border-color:transparent}.chip.good{background:var(--good-soft);border-color:transparent}.chip.bad{background:var(--bad-soft);border-color:transparent}.chip.move{background:var(--move);color:var(--move-ink);border-color:transparent}
.diff{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hair);border-radius:20px;overflow:hidden;font-size:12px}
.diff>div{padding:14px 16px;overflow-x:auto;white-space:pre}
.diff .l{background:var(--bad-soft)} .diff .r{background:var(--good-soft)}
.diff .h{display:block;font-size:10.5px;text-transform:uppercase;margin-bottom:8px;opacity:.7}
.diff mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2px}
@media (max-width:700px){.diff{grid-template-columns:1fr}}
.verdict{border-radius:24px;padding:14px 18px;font-size:13px}
.verdict.good{background:var(--good-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1;display:block}
.tip{position:fixed;pointer-events:none;z-index:99;background:var(--rail);color:var(--rail-ink);font-size:12px;padding:8px 12px;border-radius:14px;max-width:280px;opacity:0;transition:opacity .12s}

/* cover */
.cover{position:relative}
.cover .wash{position:absolute;inset:0 0 auto;height:560px;z-index:-1;filter:blur(70px);opacity:.55;pointer-events:none;
  background:radial-gradient(40% 55% at 18% 40%,var(--coral),transparent 70%),radial-gradient(40% 60% at 55% 30%,var(--sky),transparent 70%),radial-gradient(35% 50% at 85% 60%,var(--mint),transparent 70%),radial-gradient(30% 40% at 60% 85%,var(--gold),transparent 70%)}
:root[data-theme="dark"] .cover .wash{opacity:.16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover .wash{opacity:.16}}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(60px,10vw,150px);line-height:.88;letter-spacing:-.035em;margin:18px 0 18px;max-width:11ch}
.cover h1 i{color:var(--learn)}
.cover .lede{font-size:15px;color:var(--ink2);max-width:62ch}
.cover .go{display:flex;gap:10px;margin:22px 0 30px;flex-wrap:wrap}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.pcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:30px;padding:20px;min-height:220px;transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-3px);border-color:var(--ink)}
.pcard .n{font-family:var(--cond);font-size:64px;line-height:.85;text-transform:uppercase}
.pcard .t{font-family:var(--serif);font-size:28px;line-height:1.05}
.pcard ul{margin:auto 0 0;padding:0;list-style:none;font-size:11.5px;color:var(--ink3);line-height:1.6}
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 26px;background:var(--slab);color:var(--slab-ink);border-radius:36px;padding:clamp(20px,3.6vw,40px);margin-top:18px}
.bignums b{display:block;font-family:var(--cond);font-weight:400;font-size:clamp(44px,5.8vw,82px);line-height:.9;white-space:nowrap}
.bignums span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;opacity:.7;margin-top:8px;max-width:24ch}
.bignums .blue{color:#8fb0ff}

/* ===== presentation layout (v3): full-width drawing, caption bar pinned at the bottom ===== */
.stage{grid-template-columns:minmax(0,1fr)!important;gap:16px}
.side{position:static!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.side .stats{grid-column:span 1}
.side .words,.side .verdict,.side .diff,.side .stat,.side .figbox{margin:0}
svg.dg{max-height:calc(100vh - 290px)}
.page{padding-bottom:150px}
.page.on .narr{position:fixed;left:calc(260px + 22px);right:22px;bottom:14px;z-index:50;display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:center;gap:6px 20px;padding:14px 16px 14px 22px;border-radius:28px;box-shadow:0 18px 50px rgba(20,19,18,.28)}
.page.on .narr .k{flex-direction:column;gap:2px;opacity:.65}
.page.on .narr p{margin:0;min-height:0;font-size:clamp(19px,1.7vw,26px)}
.page.on .narr .ctlz{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.page.on .narr .nav2{margin:0}
.page.on .narr .nav2 button{flex:none;padding:9px 16px}
@media (max-width:960px){.page.on .narr{left:10px;right:10px}}
@media (max-width:760px){.page.on .narr{grid-template-columns:1fr;gap:8px;padding:12px 14px}.page.on .narr .k{flex-direction:row}.page.on .narr .ctlz{flex-direction:row;justify-content:space-between;align-items:center}}
.side .stats{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.side .stats .stat{padding:12px 16px}.side .stats .stat b{font-size:40px}
.side > .stat{padding:12px 16px}
#flow svg.dg,#dials svg.dg,#loraRect svg.dg,#playFig svg.dg{max-width:820px;margin:0 auto}
.narr{position:relative;overflow:hidden}.narr .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--move);border-radius:0 3px 3px 0}
@media (max-width:760px){#seqFig svg.dg,#stepFig svg.dg,#lmap svg.dg,#allFig svg.dg,#talkFig svg.dg,#shipFig svg.dg,#ladderFig svg.dg,#hwFig svg.dg,#layerFig svg.dg,#pipe svg.dg,#mapFig svg.dg,#trFig svg.dg{min-width:780px!important}.scroll:has(#seqFig)::after,.scroll:has(#stepFig)::after,.scroll:has(#lmap)::after,.scroll:has(#allFig)::after,.scroll:has(#talkFig)::after,.scroll:has(#shipFig)::after,.scroll:has(#ladderFig)::after,.scroll:has(#hwFig)::after,.scroll:has(#layerFig)::after,.scroll:has(#pipe)::after,.scroll:has(#mapFig)::after,.scroll:has(#trFig)::after{content:"swipe →";position:sticky;left:0;display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}}

/* ===== your identity: add topic colours + any page-specific CSS below ===== */
:root{--wire:#c8743a;--wire-soft:#f6dcc6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wire:#e79a60;--wire-soft:#3a2618;--gold:#4d4220;--sky:#27345a;--mint:#1d4232;--coral:#50291f}}
:root[data-theme="dark"]{--wire:#e79a60;--wire-soft:#3a2618;--gold:#4d4220;--sky:#27345a;--mint:#1d4232;--coral:#50291f}
@media (max-width:760px){.page .scroll svg.dg{min-width:760px!important}.page .scroll{position:relative}.page .scroll::after{content:"swipe \2192";position:sticky;left:0;display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}}
.src code,.words code{overflow-wrap:anywhere;word-break:break-word}
.src,.words{overflow-wrap:anywhere}
</style>
</head>
